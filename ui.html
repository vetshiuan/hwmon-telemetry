<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="darkreader-lock" />
<meta name="theme-color" content="#08080b" />
<title>硬件监控</title>
<link rel="stylesheet" href="/common-nav.css" />
<style data-view-style="1">
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark;--bg:#08080b;--panel:#111117;--panel2:#0c0c10;
  --line:rgba(255,255,255,.09);--txt:#f6f3ee;--dim:#a8a29e;--dim2:#6e6963;
  --blue:#ff8a4c;--cyan:#ffb347;--ok:#34d399;--warn:#ffb347;--bad:#ff3b5c;
}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.45;min-height:100vh;padding-bottom:calc(28px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
}
button{font-family:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:16px 14px 0}

/* ---------------- 非对称主次 Hero 区（大主卡 + 3 个 270° 转速表） ---------------- */
.hero-layout{
  display:grid;
  grid-template-columns:1.15fr 2fr;
  gap:16px;
  margin-bottom:16px;
}
@media(max-width:1020px){.hero-layout{grid-template-columns:1fr}}

.master-card{
  padding:22px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:16px;
}
.master-card.warn{border-color:rgba(251,191,36,.48)}
.master-card.bad{border-color:rgba(251,113,133,.58)}
.master-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:rgba(52,211,153,.14);color:var(--ok);border:1px solid rgba(52,211,153,.35);
}
.master-card.warn .status-chip{background:rgba(251,191,36,.15);color:var(--warn);border-color:rgba(251,191,36,.42)}
.master-card.bad .status-chip{background:rgba(251,113,133,.16);color:var(--bad);border-color:rgba(251,113,133,.48)}
.hw-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--dim2);letter-spacing:.06em}
.master-center{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.master-ring{width:138px;height:138px;position:relative;flex:none}
.master-ring canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;background:transparent!important}
.master-ring .val{position:absolute;inset:0;z-index:1;background:transparent!important;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.master-ring .num{
  font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;
  background-image:linear-gradient(180deg,var(--txt) 28%,var(--p2) 130%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.master-ring .unit{font-size:10.5px;color:var(--dim);margin-top:4px}
.master-info{flex:1;min-width:180px}
.master-info h2{margin:0 0 6px;font-size:18px;font-weight:750;color:var(--txt);letter-spacing:-.01em}
.master-info h2::before,.master-info h2::after{display:none!important}
.master-info p,.health-detail{margin:0 0 12px;font-size:12.5px;color:var(--dim);line-height:1.5}
.alert-rule{color:var(--dim2);margin-left:6px;font-size:11px}
.mini-badges{display:flex;gap:8px;flex-wrap:wrap}
.mini-badge{
  font-size:11px;padding:4px 10px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt);
}
.master-foot{
  padding-top:12px;border-top:1px solid rgba(255,255,255,.07);
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--dim2);
}

.gauges-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
@media(max-width:640px){.gauges-grid{grid-template-columns:1fr 1fr;gap:10px}}
.gauge-card{
  padding:18px 14px 16px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
}
.gauge-card.warn{border-color:rgba(251,191,36,.45)}
.gauge-card.bad{border-color:rgba(251,113,133,.55)}
.gauge-card.unknown{opacity:.68}
.gauge-head{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;
  font-size:12px;font-weight:600;color:var(--dim);margin-bottom:6px;
}
.gauge-tag{font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--dim);white-space:nowrap}
.gauge-card.warn .gauge-tag{background:rgba(251,191,36,.16);color:var(--warn)}
.gauge-card.bad .gauge-tag{background:rgba(251,113,133,.18);color:var(--bad)}
.gauge-box{width:142px;height:114px;position:relative}
.gauge-box canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;background:transparent!important}
.gauge-val{position:absolute;inset:0;z-index:1;background:transparent!important;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:10px;pointer-events:none}
.gauge-val .num{
  font-size:29px;font-weight:800;letter-spacing:-.025em;line-height:1;
  background-image:linear-gradient(180deg,var(--txt) 35%,var(--p2) 135%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.gauge-card.warn .gauge-val .num,.gauge-card.bad .gauge-val .num,.gauge-card.unknown .gauge-val .num{-webkit-text-fill-color:currentColor;background-image:none}
.gauge-card.warn .gauge-val .num{color:var(--warn)}
.gauge-card.bad .gauge-val .num{color:var(--bad)}
.gauge-card.unknown .gauge-val .num{color:var(--dim2)}
.gauge-val .unit{font-size:10.5px;color:var(--dim2);margin-top:3px}
.gauge-sub{font-size:11px;color:var(--dim2);text-align:center;margin-top:4px;line-height:1.35}
.gauge-card[data-k="cpuTemp"],.master-card[data-k="cpuTemp"]{cursor:pointer}
.gauge-card[data-k="cpuTemp"]::after{content:"⋯";position:absolute;bottom:8px;right:12px;color:var(--dim2);font-size:15px;line-height:1}

/* ---------------- 详情面板与曲线 ---------------- */
.panel-grid{display:block}.panel-grid .full{grid-column:1/-1}
@media(min-width:820px){.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}.panel-grid .panel{margin-bottom:0}}
.panel{padding:18px 20px 14px;margin-bottom:16px;min-width:0}
.panel-head{margin-bottom:12px}
.panel h2{font-size:14px;font-weight:700;color:var(--txt);margin:0;letter-spacing:.03em}
.panel-sub{font-size:11px;color:var(--dim);margin-top:5px;overflow-wrap:anywhere;line-height:1.5}.panel-sub:empty{display:none}

.daily-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media(min-width:700px){.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{padding:10px 11px;height:88px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;min-width:0}
.stat-label,.stat-value,.stat-sub{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-label{font-size:11px;color:var(--dim)}
.stat-value{font-size:16.5px;font-weight:700;color:var(--txt);margin-top:4px}
.stat-sub{font-size:10.5px;color:var(--dim2);margin-top:4px}
.daily-events{font-size:11px;color:var(--dim);margin-top:12px;line-height:1.7;min-height:3em}
.daily-events b{color:var(--txt);font-weight:600}
#dailyMeta{min-height:2.2em}

.row{display:grid;grid-template-columns:minmax(84px,112px) 1fr minmax(72px,100px);align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}.row:last-child{border-bottom:0}
.row .k{font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row.disk-row .k{white-space:normal;overflow-wrap:anywhere;line-height:1.35}
.row .v{font-size:13px;text-align:right;color:var(--txt);font-weight:650}.row .v small{color:var(--dim2);font-weight:400;font-size:10.5px;margin-left:3px}.row .v.warn{color:var(--warn)}.row .v.bad{color:var(--bad)}
.bar i.warn{background-image:none!important;background:var(--warn)}.bar i.bad{background-image:none!important;background:var(--bad)}
.empty-row{padding:16px 0;color:var(--dim2);font-size:12px;text-align:center}

.chart-panel{padding:18px 18px 14px}
.chart-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.chart-head .t{font-size:13.5px;color:var(--txt);font-weight:700;display:flex;align-items:center;gap:8px}
.chart-head .t::before{content:"";width:4px;height:14px;border-radius:4px;background-image:var(--grad-main);box-shadow:0 0 10px var(--p1)}
.chart-head .t em{font-style:normal;color:var(--dim2);font-size:11px;font-weight:400}
.legend{display:flex;gap:8px 14px;margin-left:auto;font-size:11px;color:var(--dim);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:2px;display:block;flex:none}.legend b{color:var(--txt);font-weight:600}
.chart-wrap{position:relative}.chart-wrap canvas{width:100%;height:190px;display:block;touch-action:pan-y}
.chart-tip{position:absolute;display:none;pointer-events:none;z-index:5;min-width:140px;padding:8px 10px;font-size:11px;color:var(--dim)}
.chart-tip b{color:var(--txt);font-weight:600}.chart-tip .tip-time{margin-bottom:4px;color:var(--dim2)}
.chart-range{font-size:10.5px;color:var(--dim2);margin-top:6px;min-height:15px}
.foot{text-align:center;font-size:11px;color:var(--dim2);padding:16px 0 4px}.foot b{color:var(--dim);font-weight:500}

.row.volt-row{border-top:1px solid rgba(255,255,255,.06);margin-top:2px;padding-top:10px}
.row .spark-wrap{position:relative;height:24px}.row canvas.spark{width:100%;height:24px;display:block}

/* 每核详情弹层 */
.core-pop{position:fixed;z-index:80;width:min(430px,calc(100vw - 20px));max-height:min(72vh,600px);display:flex;flex-direction:column;
  border:1px solid var(--border-glow);border-radius:var(--radius);background:var(--thead-bg);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 22px 56px rgba(0,0,0,.62),0 0 26px -12px var(--border-glow);font-size:11.5px;color:var(--dim)}
.core-pop[hidden]{display:none}
.core-pop-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:11px 12px 9px;border-bottom:1px solid var(--line);flex:none}
.core-pop-head b{color:var(--txt);font-size:12.5px;font-weight:650}
.core-pop-head .sub{display:block;color:var(--dim2);font-size:10.5px;margin-top:3px}
.core-pop-close{border:0;background:transparent;color:var(--dim2);font-size:20px;line-height:1;cursor:pointer;padding:0 3px}
.core-pop-close:hover{color:var(--txt)}
.core-pop-body{overflow:auto;padding:8px 12px 4px;flex:1;min-height:0}
.core-group{margin-bottom:9px}
.core-group-title{font-size:10.5px;color:var(--dim2);margin:6px 0 5px;letter-spacing:.04em}
.core-table{display:grid;gap:1px;min-width:360px}
.core-tr{display:grid;grid-template-columns:1.15fr repeat(4,1fr);gap:4px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer}
.core-tr>span{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.core-tr>span:first-child{text-align:left;color:var(--dim)}
.core-tr.core-th{color:var(--dim2);font-size:10px;cursor:default;background:rgba(255,255,255,.03)}
.core-tr:not(.core-th):hover{background:var(--spot)}
.core-tr.selected{background:var(--spot);outline:1px solid var(--border-glow)}
.core-tr.hottest>span:first-child,.core-tr.hottest .v{color:var(--p2);font-weight:600}
.core-tr .v{color:var(--txt);font-variant-numeric:tabular-nums}
.core-threads{margin:4px 0 2px}.core-threads summary{cursor:pointer;font-size:10.5px;color:var(--dim2);padding:5px 0}
.core-thread-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 12px;padding:4px 0}
.core-thread{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim)}
.core-thread .k{width:66px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.core-thread .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.core-thread .bar i{display:block;height:100%;background-image:var(--grad-main)}
.core-thread .v{width:34px;text-align:right;color:var(--txt)}
.core-pop-chart{flex:none;padding:8px 12px 11px;border-top:1px solid var(--line)}
.core-pop-chart-head{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--dim2);margin-bottom:5px}
.core-pop-chart canvas{width:100%;height:84px;display:block}
.core-empty{padding:22px 8px;text-align:center;color:var(--dim2);font-size:11.5px;line-height:1.7}
@media(max-width:600px){.row{grid-template-columns:minmax(78px,96px) 1fr minmax(68px,88px);gap:8px}.chart-head{display:block}.legend{margin-left:0;margin-top:8px}.chart-wrap canvas{height:170px}.panel{padding:15px 13px 10px}}
</style>
</head>
<body>
<header class="topbar" data-title="硬件监控" data-subtitle="Hardware Telemetry"></header>
<script src="/common-nav.js"></script>
<main class="wrap">
  <div class="subbar">
    <div class="subbar-group">
      <span class="subbar-label">设备</span>
      <div class="devices" id="devices">
        <button class="dev active" data-d="desktop"><i class="dev-dot" id="dot-desktop"></i>台式机</button>
        <button class="dev" data-d="laptop"><i class="dev-dot" id="dot-laptop"></i>笔记本</button>
      </div>
    </div>
    <div class="subbar-group">
      <span class="subbar-label">时间范围</span>
      <div class="range-switch" aria-label="时间范围">
        <button class="range-btn active" data-range="5m">5 分钟</button>
        <button class="range-btn" data-range="1h">1 小时</button>
        <button class="range-btn" data-range="today">今日</button>
      </div>
    </div>
  </div>

  <!-- 非对称 Hero：左大主卡（整合健康状态+主仪表） + 右侧 270° 转速表 -->
  <section class="hero-layout">
    <article class="master-card health" id="health">
      <div class="master-top">
        <span class="status-chip" id="healthTitle">正在读取</span>
        <span class="hw-code" id="hwCode">VET-PC // 8090</span>
      </div>
      <div class="master-center">
        <div class="master-ring">
          <canvas id="masterCanvas"></canvas>
          <div class="val">
            <span class="num" id="masterNum">--</span>
            <span class="unit" id="masterUnit">°C</span>
          </div>
        </div>
        <div class="master-info">
          <h2 id="masterTitle">等待设备响应</h2>
          <div class="health-detail" id="healthDetail">等待设备返回实时快照</div>
          <div class="mini-badges" id="masterBadges"></div>
        </div>
      </div>
      <div class="master-foot">
        <span id="healthMeta">采样间隔 2 秒</span>
        <span id="sourceFoot">等待数据源状态</span>
      </div>
    </article>

    <div class="gauges-grid" id="hero"></div>
  </section>

  <div class="panel-grid">
    <section class="panel">
      <div class="panel-head"><h2>处理器</h2><div class="panel-sub" id="cpuModel"></div></div>
      <div id="cpuRows"></div>
    </section>
    <section class="panel" id="gpuPanel">
      <div class="panel-head"><h2 id="gpuTitle">显卡</h2><div class="panel-sub" id="gpuModel"></div></div>
      <div id="gpuRows"></div>
    </section>
    <section class="panel full">
      <div class="panel-head"><h2>存储与内存</h2><div class="panel-sub" id="diskCount"></div></div>
      <div id="otherRows"></div>
    </section>
    <section class="panel full" id="dailyPanel">
      <div class="daily-top">
        <div><h2 id="summaryTitle">5 分钟小结</h2><div class="panel-sub" id="dailyMeta">等待采样统计</div></div>
      </div>
      <div class="stats-grid" id="dailyStats"></div>
      <div class="daily-events" id="dailyEvents"></div>
    </section>
    <section class="panel chart-panel">
      <div class="chart-head"><div class="t">温度曲线<em id="tempWindow">近 5 分钟</em></div><div class="legend" id="tempLegend"></div></div>
      <div class="chart-wrap"><canvas id="cTemp"></canvas><div class="chart-tip" id="tipTemp"></div></div>
      <div class="chart-range" id="tempRange"></div>
    </section>
    <section class="panel chart-panel">
      <div class="chart-head"><div class="t">功耗曲线<em id="powerWindow">近 5 分钟 · CPU / GPU 同图</em></div><div class="legend" id="powerLegend"></div></div>
      <div class="chart-wrap"><canvas id="cPower"></canvas><div class="chart-tip" id="tipPower"></div></div>
      <div class="chart-range" id="powerRange"></div>
    </section>
  </div>
  <div class="foot">采样间隔 <b>2s</b> · EasyTier 直连</div>
</main>

<div class="core-pop" id="corePop" hidden role="dialog" aria-label="处理器核心明细">
  <div class="core-pop-head">
    <div><b>处理器核心明细</b><span class="sub" id="corePopSub">点击核心行查看温度曲线</span></div>
    <button class="core-pop-close" id="corePopClose" aria-label="关闭">×</button>
  </div>
  <div class="core-pop-body" id="corePopBody"></div>
  <div class="core-pop-chart">
    <div class="core-pop-chart-head"><span id="coreChartLabel">温度曲线</span><span id="coreChartMeta"></span></div>
    <canvas id="coreSpark"></canvas>
  </div>
</div>
<script>
const PEERS=[
  {key:'desktop',label:'台式机',device:'VeT-PC',base:'http://10.1.1.252:8090'},
  {key:'laptop',label:'笔记本',device:'VeT-LAPTOP',base:'http://10.1.1.251:8090'}
];
let cur=new URLSearchParams(location.search).get('dev')==='laptop'?'laptop':'desktop';
let layoutSig='',activeCards=[],tickSeq=0,badgeSeq=0,dailySeq=0,chartSeq=0,chartRange='5m',lastSnapshot={},offlineOnce=true;
const RANGE_TITLE={'5m':'5 分钟小结','1h':'1 小时小结','today':'今日小结','7d':'7 天概览','30d':'30 天概览'};
const RANGE_LABEL={'5m':'近 5 分钟','1h':'近 1 小时','today':'今日','7d':'近 7 天','30d':'近 30 天'};
const LONG_RANGE={'7d':7,'30d':30};
const isLongRange=()=>false;
const HERO_POOL=[
  {k:'gpuCore',t:'GPU 核心',u:'°C',max:100,metric:'gpu.core'},
  {k:'gpuHot',t:'GPU 热点',u:'°C',max:115,metric:'gpu.hot'},
  {k:'cpuTemp',t:'CPU 温度',u:'°C',max:105,metric:'cpu.temp'},
  {k:'cpuCoreMax',t:'CPU 核心最高',u:'°C',max:105,metric:'cpu.core_max'},
  {k:'cpuLoad',t:'CPU 占用',u:'%',max:100,neutral:true,dp:0},
  {k:'memPct',t:'内存占用',u:'%',max:100,metric:'mem.pct',dp:0}
];
const GET={
  gpuCore:s=>s.gpu?.core,gpuHot:s=>s.gpu?.hot,
  cpuTemp:s=>s.cpu?.temp,cpuCoreMax:s=>s.cpu?.core_max,
  cpuLoad:s=>s.cpu?.load,memPct:s=>s.mem?.pct
};
const fmt=(v,dp=1)=>Number.isFinite(v)?v.toFixed(dp):'--';
const peerNow=()=>PEERS.find(p=>p.key===cur)||PEERS[0];
const alertsOf=s=>Object.fromEntries((s.alerts||[]).map(a=>[a.key,a]));
const isLaptop=s=>(s.capabilities?.device_class? s.capabilities.device_class==='laptop':cur==='laptop');

function pickCards(s){
  const keys=isLaptop(s)?['cpuTemp','cpuCoreMax','memPct']:['cpuTemp','cpuCoreMax','gpuCore'];
  return keys.map(k=>HERO_POOL.find(c=>c.k===k)).filter(Boolean);
}

const HW_FALLBACK={stops:['#ff5e1a','#ffb347','#ff3b5c'],warn:'#ffb347',bad:'#ff3b5c',cpu:'#ffb347',gpu:'#ff5e1a',track:'rgba(255,255,255,.10)',lineCap:'round'};
const pal=()=>(window.getHwmonThemePalette?window.getHwmonThemePalette():HW_FALLBACK);
const themeName=()=>(window.getHwmonTheme?window.getHwmonTheme():'hypercar');
function hex2rgb(s){let h=String(s==null?'':s).replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return[parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0]}
function mixColor(a,b,f){const A=hex2rgb(a),B=hex2rgb(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*f)).join(',')+')'}
function colorAt(stops,t){const n=stops.length-1;if(n<=0)return stops[0];const p=Math.max(0,Math.min(1,t))*n,i=Math.min(n-1,Math.floor(p));return mixColor(stops[i],stops[i+1],p-i)}
function cssStops(){return pal().stops.join(',')}
function ringTone(color){
  const P=pal();
  if(!color||color==='theme')return'theme';
  if(color==='warn'||color===P.warn||color==='#fbbf24'||color==='#ffb347')return P.warn;
  if(color==='bad'||color===P.bad||color==='#fb7185'||color==='#ff3b5c')return P.bad;
  return'theme';
}

/* 统一仪表盘绘制：isMaster=true 画 360° 大主环；isMaster=false 画 270° 开口跑车转速表 */
function drawDial(cv,pct,color,isMaster){
  if(!cv)return;
  const P=pal(),tone=ringTone(color);
  const dpr=window.devicePixelRatio||1,wCss=cv.clientWidth||(isMaster?138:142),hCss=cv.clientHeight||(isMaster?138:114);
  if(!wCss||!hCss)return;
  const bw=Math.round(wCss*dpr),bh=Math.round(hCss*dpr);
  if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh}
  cv.dataset.pct=pct;cv.dataset.color=color;cv.dataset.master=isMaster?'1':'0';
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,wCss,hCss);

  const cx=wCss/2,cy=isMaster?hCss/2:hCss*0.58;
  const r=isMaster?Math.min(wCss,hCss)*0.40:Math.min(wCss,hCss)*0.43;
  const start=isMaster?-Math.PI*0.5:Math.PI*0.78;
  const span=isMaster?Math.PI*2:Math.PI*1.44;
  const lw=isMaster?10:8.5;
  const p=Math.max(0,Math.min(1,pct||0));
  const single=tone==='theme'?null:tone;

  // 外圈刻度
  const ticks=isMaster?36:24;
  for(let i=0;i<=ticks;i++){
    const a=start+(span*i)/ticks;
    const major=i%6===0;
    const r1=r+(major?7:4),r2=r+1;
    const on=(i/ticks)<=p;
    c.beginPath();
    c.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
    c.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
    c.strokeStyle=on?(single||colorAt(P.stops,i/ticks)):'rgba(255,255,255,.15)';
    c.lineWidth=major?1.6:1;c.lineCap='round';c.stroke();
  }

  // 底轨
  c.beginPath();c.arc(cx,cy,r-6,start,start+span);
  c.strokeStyle=P.track;c.lineWidth=lw;c.lineCap='round';c.stroke();

  if(p<=.002){c.shadowBlur=0;return}
  const end=start+span*p,glow=single||P.stops[0];
  c.save();c.shadowBlur=16;c.shadowColor=glow+'99';
  c.beginPath();c.arc(cx,cy,r-6,start,end);c.strokeStyle=glow+'2e';c.lineWidth=lw;c.lineCap='round';c.stroke();
  c.restore();

  if(single){
    c.beginPath();c.arc(cx,cy,r-6,start,end);c.strokeStyle=single;c.lineWidth=lw;c.lineCap='round';c.stroke();
  }else{
    const segs=Math.max(24,Math.round(90*p)),step=(span*p)/segs;
    c.lineWidth=lw;c.lineCap='butt';
    for(let i=0;i<segs;i++){
      const a0=start+step*i,a1=a0+step*1.06;
      c.beginPath();c.arc(cx,cy,r-6,a0,a1);c.strokeStyle=colorAt(P.stops,(i+.5)/segs);c.stroke();
    }
    c.lineCap='round';
    c.beginPath();c.arc(cx,cy,r-6,start-.001,start+.001);c.strokeStyle=colorAt(P.stops,0);c.stroke();
    c.beginPath();c.arc(cx,cy,r-6,end-.001,end+.001);c.strokeStyle=colorAt(P.stops,1);c.stroke();
  }

  const tx=cx+Math.cos(end)*(r-6),ty=cy+Math.sin(end)*(r-6);
  c.save();c.shadowBlur=13;c.shadowColor='#fff';
  c.beginPath();c.arc(tx,ty,3.8,0,Math.PI*2);c.fillStyle='#fff';c.fill();
  c.restore();c.shadowBlur=0;
}

window.addEventListener('resize',()=>{
  const mc=document.getElementById('masterCanvas');
  if(mc)drawDial(mc,parseFloat(mc.dataset.pct||0),mc.dataset.color||'theme',true);
  document.querySelectorAll('#hero canvas').forEach(cv=>{
    drawDial(cv,parseFloat(cv.dataset.pct||0),cv.dataset.color||'theme',false);
  });
});

function rebuildHero(cards){
  const host=document.getElementById('hero');
  host.innerHTML=cards.map(cfg=>`<article class="gauge-card unknown" data-k="${cfg.k}">
    <div class="gauge-head"><span>${cfg.t}</span><span class="gauge-tag">等待</span></div>
    <div class="gauge-box"><canvas></canvas><div class="gauge-val"><span class="num">--</span><span class="unit">${cfg.u}</span></div></div>
    <div class="gauge-sub"></div></article>`).join('');
}

function metaOf(k,s){
  switch(k){
    case'gpuCore':return'预警 80 / 严重 90°C';
    case'cpuTemp':return'封装温度 · 点击看每核明细';
    case'cpuCoreMax':return s.cpu?.cores?.hottest?`最热 ${s.cpu.cores.hottest.label} · 预警 85°C`:'最热核心 · 预警 85 / 严重 95°C';
    case'cpuLoad':return'处理器总占用 · 中性监控';
    case'memPct':return'资源提示 · 预警 75 / 严重 90%';
    default:return'';
  }
}

function setCard(cfg,v,s){
  const card=document.querySelector(`.gauge-card[data-k="${cfg.k}"]`);if(!card)return;
  const has=Number.isFinite(v),alert=alertsOf(s)[cfg.metric],st=!has?'unknown':alert?.severity||'ok';
  card.classList.remove('ok','warn','bad','unknown');card.classList.add(st);
  card.querySelector('.num').textContent=has?v.toFixed(cfg.dp??1):'--';
  drawDial(card.querySelector('canvas'),has?Math.max(0,Math.min(1,v/(cfg.max||100))):0,st==='bad'?'bad':st==='warn'?'warn':'theme',false);
  const meta=card.querySelector('.gauge-sub'),txt=metaOf(cfg.k,s);if(meta.textContent!==txt)meta.textContent=txt;
  card.querySelector('.gauge-tag').textContent=!has?'无数据':alert?(st==='bad'?'严重':'预警'):(cfg.neutral?'实时':'正常');
}

function updateMaster(s){
  const laptop=isLaptop(s),g=s.gpu||{},c=s.cpu||{},m=s.mem||{};
  document.getElementById('hwCode').textContent=(s.device||peerNow().device)+' // 8090';
  const masterEl=document.getElementById('health');
  if(laptop){
    masterEl.setAttribute('data-k','cpuTemp');
    const val=c.temp,pct=Number.isFinite(val)?val/105:0;
    const al=alertsOf(s)['cpu.temp']?.severity;
    document.getElementById('masterNum').textContent=fmt(val,1);
    document.getElementById('masterUnit').textContent='CPU 封装 °C';
    document.getElementById('masterTitle').textContent=c.name||'笔记本处理器';
    const badges=[`功耗 ${fmt(c.power,1)}W`,`占用 ${fmt(c.load,0)}%`,g.clock?`核显 ${fmt(g.clock,0)} MHz`:`内存 ${fmt(m.pct,0)}%`];
    document.getElementById('masterBadges').innerHTML=badges.map(b=>`<span class="mini-badge">${escapeHtml(b)}</span>`).join('');
    drawDial(document.getElementById('masterCanvas'),pct,al||'theme',true);
  }else{
    masterEl.removeAttribute('data-k');
    const val=g.hot,pct=Number.isFinite(val)?val/115:0;
    const al=alertsOf(s)['gpu.hot']?.severity;
    document.getElementById('masterNum').textContent=fmt(val,1);
    document.getElementById('masterUnit').textContent='GPU 热点 °C';
    document.getElementById('masterTitle').textContent=g.name||'独立显卡';
    const badge=(k,v,u)=>`<span class="mini-badge"><span class="mb-k">${k}</span><b class="mb-v">${v}</b><small class="mb-u">${u}</small></span>`;
    const badges=[
      badge('整卡',fmt(g.power,0),'W'),
      g.pin_volt!=null?badge('16pin',fmt(g.pin_volt,2),'V'):badge('风扇',g.fan!=null?Math.round(g.fan):'--','RPM'),
      badge('显存',fmt(g.mem,1),'°C')
    ];
    document.getElementById('masterBadges').innerHTML=badges.join('');
    drawDial(document.getElementById('masterCanvas'),pct,al||'theme',true);
  }
}

function updateHero(s){
  const cards=pickCards(s),sig=cur+':'+cards.map(c=>c.k).join(',');
  if(sig!==layoutSig){layoutSig=sig;activeCards=cards;rebuildHero(cards)}
  activeCards.forEach(cfg=>setCard(cfg,GET[cfg.k]?.(s),s));
  updateMaster(s);
}

function setStatus(state,text){if(window.setTopbarLive){window.setTopbarLive(state,text);return}const live=document.getElementById('live');if(live){live.className='live '+state;const t=document.getElementById('liveTxt');if(t)t.textContent=text}}
function sourceText(s){
  const caps=s.capabilities||{},gpuz=caps.gpuz_expected?(s.sources?.gpuz?'GPU-Z 正常':'GPU-Z 异常'):'GPU-Z 不适用';
  return`LHM ${s.sources?.lhm?'正常':'断开'} · ${gpuz}`;
}
function renderHealth(s){
  const h=s.health||{status:'ok',label:'运行正常'},alerts=s.alerts||[],box=document.getElementById('health');
  box.className='master-card health '+h.status;
  document.getElementById('healthTitle').textContent=(h.status==='ok'?'SYSTEM NOMINAL · ':'')+h.label;
  const rank=a=>a.category==='source'?0:a.category==='resource'?2:1;
  const top=[...alerts].sort((a,b)=>rank(a)-rank(b)).slice(0,2);
  document.getElementById('healthDetail').innerHTML=top.length?top.map(a=>`<div><b>${escapeHtml(a.message)}</b>${durationText(a)}<span class="alert-rule">${escapeHtml(a.rule||'')}</span></div>`).join(''):'温度、电压、资源与数据源均在安全阈值内';
  const age=Number.isFinite(s.snapshot_age_ms)?` · ${Math.round(s.snapshot_age_ms/1000)}s 前`:'';
  const res=h.resource?` · 资源提示 ${h.resource} 项`:'';
  document.getElementById('healthMeta').textContent=`采样 ${formatTime(s.ts)}${age}${res}`;

function barRow(k,pct,valHtml,cls='',title='',rowCls=''){
  const inner=Number.isFinite(pct)?`<i class="${cls}" style="width:${Math.max(0,Math.min(100,pct*100)).toFixed(1)}%"></i>`:'';
  return`<div class="row ${rowCls}"><div class="k" title="${escapeHtml(title||k)}">${escapeHtml(k)}</div><div class="bar ${Number.isFinite(pct)?'':'none'}">${inner}</div><div class="v ${cls}">${valHtml}</div></div>`;
}
function metricRow(label,value,unit,pct,key,s,dp=1){
  const a=alertsOf(s)[key],cls=a?.severity||'';
  return barRow(label,pct,`${fmt(value,dp)}<small>${unit}</small>`,cls);
}
function sparkRow(label,key,value,unit,dp,s,alertKey){
  const a=alertKey?alertsOf(s)[alertKey]:null,sev=a?.severity||'';
  const val=Number.isFinite(value)?`${value.toFixed(dp)}<small>${unit}</small>`:`--<small>${unit}</small>`;
  return`<div class="row volt-row"><div class="k">${escapeHtml(label)}</div>`+
    `<div class="spark-wrap"><canvas class="spark" data-spark="${key}" data-severity="${sev}"></canvas></div>`+
    `<div class="v ${sev}">${val}</div></div>`;
}
function renderVoltageSparks(h){
  const P=pal(),rainbow=themeName()==='rainbow';
  document.querySelectorAll('canvas.spark').forEach(cv=>{
    const key=cv.dataset.spark,w=cv.clientWidth,ht=cv.clientHeight,dpr=window.devicePixelRatio||1;
    if(!w||!ht)return;
    cv.width=Math.round(w*dpr);cv.height=Math.round(ht*dpr);
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,ht);
    const lo=key==='pin_volt'?11.0:0,hi=key==='pin_volt'?13.0:1.5;
    const y=v=>ht-2-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(ht-4);
    if(key==='pin_volt'){
      g.setLineDash([3,3]);g.strokeStyle='rgba(251,191,36,.42)';g.lineWidth=1;
      [11.8,12.6].forEach(v=>{g.beginPath();g.moveTo(0,y(v));g.lineTo(w,y(v));g.stroke()});
      g.setLineDash([]);
    }
    const times=(h&&h.t)||[],raw=(h&&h[key])||[];
    if(raw.filter(Number.isFinite).length<2||times.length<2){
      g.fillStyle='rgba(160,155,148,.85)';g.font='10px sans-serif';g.textAlign='center';
      g.fillText('等待历史采样',w/2,ht/2+3);return;
    }
    const t0=times[0],span=Math.max(1,times[times.length-1]-t0);
    const x=t=>2+(t-t0)/span*(w-4);
    const sev=cv.dataset.severity;
    const color=sev==='bad'?P.bad:sev==='warn'?P.warn:P.cpu;
    let stroke=color;
    if(rainbow&&!sev){
      const lg=g.createLinearGradient(0,0,w,0);
      P.stops.forEach((cc,i)=>lg.addColorStop(P.stops.length===1?0:i/(P.stops.length-1),cc));
      stroke=lg;
    }
    g.save();g.beginPath();g.strokeStyle=stroke;g.lineWidth=1.8;g.lineJoin='round';g.shadowBlur=8;g.shadowColor=color+'99';
    let open=false,last=null;
    for(let i=0;i<raw.length;i++){
      const v=raw[i],t=times[i];
      if(!Number.isFinite(v)||!Number.isFinite(t)){open=false;continue}
      const xx=x(t),yy=y(v);
      if(!open){g.moveTo(xx,yy);open=true}else g.lineTo(xx,yy);
      last=[xx,yy];
    }
    g.stroke();g.restore();
    if(last){
      g.save();g.shadowBlur=10;g.shadowColor=color;
      g.beginPath();g.arc(last[0],last[1],3.1,0,Math.PI*2);g.fillStyle=color;g.fill();
      g.beginPath();g.arc(last[0],last[1],1.4,0,Math.PI*2);g.fillStyle='#fff';g.fill();
      g.restore();
    }
  });
}

  document.getElementById('gpuTitle').textContent=laptop?'集成显卡':'显卡';
  document.getElementById('gpuModel').textContent=g.name||'未识别型号';document.getElementById('cpuModel').textContent=c.name||'未识别型号';
  let gpuRows;
  if(laptop){
    gpuRows=[
      barRow('核心频率',(g.clock||0)/1600,`${fmt(g.clock,0)}<small>MHz</small>`),
      barRow('3D 引擎占用',Number.isFinite(g.load)?g.load/100:null,`${fmt(g.load,0)}<small>%</small>`),
      barRow('核显功耗',(g.power||0)/45,`${fmt(g.power,1)}<small>W</small>`),
      barRow('共享显存',Number.isFinite(g.mem_pct)?g.mem_pct/100:null,`${fmt(g.mem_pct,0)}<small>%</small>`,'',`共享显存 ${fmt(g.mem_used,0)} / ${fmt(g.mem_total,0)} MB`)
    ].join('');
  }else{
    gpuRows=[
      metricRow('核心温度',g.core,'°C',Number.isFinite(g.core)?g.core/100:null,'gpu.core',s),
      metricRow('热点温度',g.hot,'°C',Number.isFinite(g.hot)?g.hot/115:null,'gpu.hot',s),
      metricRow('显存结温',g.mem,'°C',Number.isFinite(g.mem)?g.mem/110:null,'gpu.mem',s),
      barRow('核心频率',(g.clock||0)/3200,`${fmt(g.clock,0)}<small>MHz</small>`),
      barRow('16pin 功耗',(g.pin_power||0)/600,`${fmt(g.pin_power,0)}<small>W</small>`),
      barRow('风扇转速',(g.fan||0)/3000,`${g.fan!=null?Math.round(g.fan):'--'}<small>RPM</small>`),
      sparkRow('16pin 电压','pin_volt',g.pin_volt,'V',2,s,'gpu.pin_volt')
    ].join('');
  }
  document.getElementById('gpuRows').innerHTML=gpuRows;
  document.getElementById('cpuRows').innerHTML=[
    metricRow('封装温度',c.temp,'°C',Number.isFinite(c.temp)?c.temp/105:null,'cpu.temp',s),
    metricRow('核心最高',c.core_max,'°C',Number.isFinite(c.core_max)?c.core_max/105:null,'cpu.core_max',s),
    barRow('封装功耗',(c.power||0)/(laptop?95:219),`${fmt(c.power)}<small>W</small>`),
    barRow('总占用',(c.load||0)/100,`${fmt(c.load,0)}<small>%</small>`),
    barRow('核心频率',(c.clock||0)/5600,`${fmt(c.clock,0)}<small>MHz</small>`),
    sparkRow('CPU 电压','cpu_volt',c.volt,'V',3,s)
  ].join('');
  const disks=s.disk||[];document.getElementById('diskCount').textContent=disks.length?`共 ${disks.length} 块 · 完整名称可长按或悬停查看`:'';
  let html='';
  if(m.pct!=null)html+=metricRow('内存占用',m.pct,'%',m.pct/100,'mem.pct',s,0);
  else html+=barRow('内存数据',null,`<small>LHM 数据含页面文件，未换算物理占用</small>`);
  html+=disks.map((d,i)=>{const a=alertsOf(s)[`disk.${i}`];return barRow(d.name,d.used_pct/100,`${fmt(d.used_pct,0)}<small>%</small>`,a?.severity||'',d.name,'disk-row')}).join('');
  document.getElementById('otherRows').innerHTML=html||'<div class="empty-row">暂无存储与内存数据</div>';
  renderVoltageSparks(window._lastHist);
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function formatTime(ts){if(!Number.isFinite(ts))return'--';return new Date(ts).toLocaleTimeString('zh-CN',{hour12:false})}
function durationText(a){
  if(!Number.isFinite(a.since)||String(a.key).startsWith('source.'))return'';
  const seconds=Math.max(0,Math.round((Date.now()-a.since)/1000));
  return`<span> · 持续 ${seconds<60?seconds+' 秒':Math.floor(seconds/60)+' 分钟'}</span>`;
}
async function fetchJSON(peer,path,timeout=4000){
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);
  try{const r=await fetch(peer.base+path,{cache:'no-store',signal:ctrl.signal});if(!r.ok)return null;return await r.json()}catch(e){return null}finally{clearTimeout(timer)}
}

}

async function tick(){
  const seq=++tickSeq,peer=peerNow(),s=await fetchJSON(peer,'/api/snapshot');
  if(seq!==tickSeq||cur!==peer.key)return;
  if(!s||s.online===false){
    if(isLongRange()){
      setStatus('warn',peer.label+'离线 · 显示路由器历史归档');
      renderOfflinePanel(peer.label);refreshCharts();return;
    }
    renderOffline(peer.label+'离线');
    if(offlineOnce){offlineOnce=false;refreshDaily()}
    return;
  }
  offlineOnce=true;
  if(s.device&&peer.device&&s.device!==peer.device){renderOffline(peer.label+'设备身份不匹配');return}
  setStatus(s.health?.status==='bad'?'bad':s.health?.status==='warn'?'warn':'ok',formatTime(s.ts)+' 采样');
  lastSnapshot=s;updateHero(s);renderHealth(s);renderDetail(s);
  CoreInspector.update(s);
  if(!isLongRange())refreshCharts();
}
async function refreshCharts(){
  const seq=++chartSeq,peer=peerNow(),range=chartRange;
  const h=isLongRange()
    ? await fetchJSON({base:''},`/api/hw/longterm?device=${peer.key}&window=${range}`,7000)
    : await fetchJSON(peer,'/api/history?window='+range,5000);
  if(seq!==chartSeq||cur!==peer.key||range!==chartRange)return;
  if(h&&h.t&&h.t.length){renderCharts(h);renderVoltageSparks(h)}

const CHART_WINDOW=300000;

function renderCharts(h){

function drawChart(cv,cfg,legendId,rangeId,tipId){

  const vals=cfg.series.flatMap(s=>s.data.filter(Number.isFinite));
  const minV=0,maxV=cfg.kind==='temp'?Math.max(100,Math.ceil(Math.max(...vals)/10)*10):niceMax(Math.max(10,...vals));
  const pad={l:44,r:12,t:12,b:26},plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;
  const latest=Number.isFinite(cfg.meta?.end)?cfg.meta.end:Math.max(...cfg.times.filter(Number.isFinite),Date.now()),start=Number.isFinite(cfg.meta?.start)?cfg.meta.start:latest-CHART_WINDOW;
  const x=t=>pad.l+(Math.max(start,Math.min(latest,t))-start)/(latest-start)*plotW,y=v=>pad.t+plotH-(Math.max(minV,Math.min(maxV,v))-minV)/(maxV-minV)*plotH;
  c.font='10px sans-serif';c.lineWidth=1;c.setLineDash([]);

    c.fillStyle='rgba(161,161,170,.72)';c.textAlign='right';c.textBaseline='middle';c.fillText(Math.round(value)+(cfg.kind==='temp'?'°':'W'),pad.l-7,yy);
  }

    c.fillStyle='rgba(161,161,170,.65)';c.textAlign=i===0?'left':i===4?'right':'center';c.textBaseline='top';

      for(let i=1;i<seg.length;i++)c.lineTo(seg[i][0],seg[i][1]);

    const d=await fetchJSON(peer,`/api/core_history?core=${encodeURIComponent(id)}&window=${chartRange}`,5000);
    if(my!==reqSeq||!anchor||id!==selected)return;
    history=d&&Array.isArray(d.t)?d:null;drawSpark();renderValues();
  }
  function drawSpark(){
    const cv=$('coreSpark');if(!cv)return;
    const w=cv.clientWidth,h=cv.clientHeight,dpr=window.devicePixelRatio||1;if(!w||!h)return;
    cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
    g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=1;
    [0.25,0.5,0.75].forEach(p=>{g.beginPath();g.moveTo(0,h*p);g.lineTo(w,h*p);g.stroke()});
    const pts=(history?.t||[]).map((t,i)=>[t,history.temp?.[i]]).filter(p=>Number.isFinite(p[1]));
    $('coreChartLabel').textContent=`${coreMap().get(selected)?.label||selected||'—'} · 温度曲线`;
    if(pts.length<2){
      g.fillStyle='#667286';g.font='11px sans-serif';g.textAlign='center';
      g.fillText(history?'该区间暂无采样（每 30 秒记录一次）':'正在读取历史…',w/2,h/2+4);$('coreChartMeta').textContent='';return;
    }
    const vals=pts.map(p=>p[1]),lo=Math.max(0,Math.floor(Math.min(...vals)/10)*10-10),hi=Math.ceil(Math.max(...vals)/10)*10+10;
    const t0=pts[0][0],span=Math.max(1,pts[pts.length-1][0]-t0);
    const x=t=>6+(t-t0)/span*(w-12),y=v=>h-6-(v-lo)/(hi-lo)*(h-12);
    const P=pal();let stroke=P.cpu;
    if(themeName()==='rainbow'){const lg=g.createLinearGradient(0,0,w,0);P.stops.forEach((cc,i)=>lg.addColorStop(P.stops.length===1?0:i/(P.stops.length-1),cc));stroke=lg}
    g.save();g.shadowBlur=8;g.shadowColor=P.cpu+'aa';
    g.beginPath();g.strokeStyle=stroke;g.lineWidth=2;g.lineJoin='round';
    pts.forEach((p,i)=>i?g.lineTo(x(p[0]),y(p[1])):g.moveTo(x(p[0]),y(p[1])));
    g.stroke();g.restore();
    const last=pts[pts.length-1];
    g.save();g.shadowBlur=12;g.shadowColor='#fff';
    g.beginPath();g.arc(x(last[0]),y(last[1]),3.8,0,Math.PI*2);g.fillStyle='#fff';g.fill();
    g.restore();
    $('coreChartMeta').textContent=`${RANGE_LABEL[chartRange]||''} · ${fmt(last[1],1)}°C · 峰值 ${fmt(Math.max(...vals),1)}°C`;
  }
  function open(card){anchor=card;$('corePop').hidden=false;renderStructure();renderValues();position();if(selected)fetchHistory()}
  function close(){anchor=null;history=null;lastFetchKey='';reqSeq++;$('corePop').hidden=true}
  function update(s){snapshot=s;if(!anchor)return;if(layoutOf(coresOf())!==layout)renderStructure();renderValues()}
  function init(){
    const layoutEl=document.querySelector('.hero-layout'),pop=$('corePop');
    layoutEl.addEventListener('click',e=>{
      const card=e.target.closest('[data-k]');
      if(!card||!DETAIL_KEYS.has(card.dataset.k))return;
      e.stopPropagation();if(anchor===card){close();return}open(card);
    });
    pop.addEventListener('click',e=>{const tr=e.target.closest('.core-tr[data-core]');if(!tr)return;selected=tr.dataset.core;renderValues();fetchHistory()});
    $('corePopClose').addEventListener('click',close);
    document.addEventListener('click',e=>{if(anchor&&!pop.contains(e.target)&&!e.target.closest('[data-k]'))close()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    window.addEventListener('scroll',()=>{if(anchor)position()},{passive:true});
    window.addEventListener('resize',()=>{if(anchor){position();drawSpark()}});
  }
  return {init,update,close,onRangeChange:()=>{if(anchor)fetchHistory()},redraw:()=>{if(anchor)drawSpark()}};
})();

CoreInspector.init();
window.addEventListener('hwmon:theme',()=>{
  const mc=document.getElementById('masterCanvas');
  if(mc)drawDial(mc,parseFloat(mc.dataset.pct||0),mc.dataset.color||'theme',true);
  document.querySelectorAll('#hero canvas').forEach(cv=>{drawDial(cv,parseFloat(cv.dataset.pct||0),cv.dataset.color||'theme',false)});
  if(window._lastHist){
    renderCharts(window._lastHist);
    const h=window._lastHist;
    if((h.cpu_volt||[]).filter(Number.isFinite).length>1||(h.pin_volt||[]).filter(Number.isFinite).length>1)renderVoltageSparks(h);
  }
  CoreInspector.redraw();
});
tick();refreshBadges();refreshDaily();setInterval(tick,2000);setInterval(refreshBadges,10000);setInterval(refreshDaily,30000);
</script>
